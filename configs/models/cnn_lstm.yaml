# CNN-LSTM model configuration
# Architecture: 4-block CNN (from-scratch) -> shared weights per frame -> LSTM -> FC

model_type: "cnn_lstm"

# CNN backbone
cnn_channels: [32, 64, 128, 256]   # output channels per block
input_size: 112                     # input frame size (H=W)
input_channels: 3                   # RGB
cnn_output_dim: 256                 # after Global Average Pooling

# LSTM
lstm_hidden: 128    # ASSUMPTION: 128 units (to be confirmed by experiments)
lstm_layers: 1      # 1-2 layers (hyperparameter)
lstm_dropout: 0.0   # dropout between LSTM layers (only active if lstm_layers > 1)

# Output head
head_dropout: 0.4

# Temporal pooling: "last" | "mean" | "attention"
pooling: "mean"

# Frame clip settings
window_size: 16    # T frames per clip — experiment {16, 32}
stride: 8

# Training
optimizer: "adamw"
lr: 3.0e-4
weight_decay: 1.0e-4
batch_size: 8      # small batch due to high memory per sample
max_epochs: 30
gradient_clip: 1.0
early_stopping_patience: 10
early_stopping_metric: "val_macro_f1"

scheduler: "reduce_on_plateau"
scheduler_patience: 5
scheduler_factor: 0.5

short_segment_policy: "pad"
num_workers: 0

loss: "weighted_cross_entropy"
focal_gamma: 2.0
cost_sensitive_lambda: 0.5
loss_weight_cap: 10.0

seed: 42
use_amp: true

# Frame source (must match extract_frames.py settings)
frame_store_size: [128, 128]   # stored size; center-cropped to input_size at load time

