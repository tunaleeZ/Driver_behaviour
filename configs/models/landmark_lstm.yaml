# Geo-LSTM / Landmark-LSTM model configuration
# Variant A (geo): input_dim=4, feature_config=geo
# Variant B (landmark_lstm): input_dim=2K+4, feature_config=landmark_lstm
# Both share the LSTMClassifier architecture.

model_type: "lstm_classifier"

# Feature variant: "geo" | "geo7" | "landmark_lstm"
# Determines input_dim automatically from features.yaml
feature_config: "geo"

# LSTM
hidden_size: 64      # ASSUMPTION: 64 units (to be confirmed by experiments)
num_layers: 1        # 1-2 layers (hyperparameter)
dropout: 0.3         # dropout between layers and before FC

# Temporal pooling: "last" | "mean" | "attention"
pooling: "mean"

# Training
optimizer: "adamw"
lr: 1.0e-3
weight_decay: 1.0e-4
batch_size: 64
max_epochs: 50
gradient_clip: 1.0
early_stopping_patience: 10
early_stopping_metric: "val_macro_f1"

# Learning rate scheduler
scheduler: "reduce_on_plateau"  # "reduce_on_plateau" | "cosine"
scheduler_patience: 5
scheduler_factor: 0.5

# Data
window_size: 30
stride: 15
short_segment_policy: "pad"
num_workers: 0        # 0 on Windows, 2-4 on Kaggle

# Loss: "cross_entropy" | "weighted_cross_entropy" | "focal" | "cost_sensitive"
loss: "weighted_cross_entropy"
focal_gamma: 2.0
cost_sensitive_lambda: 0.5   # lambda for cost-sensitive loss
loss_weight_cap: 10.0        # max class weight to avoid instability

# Reproducibility
seed: 42

# AMP (automatic mixed precision) — enabled when GPU available
use_amp: true

