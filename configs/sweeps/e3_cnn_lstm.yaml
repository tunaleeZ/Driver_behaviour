# Sweep E3: CNN-LSTM
# Grid search over T, pooling, and loss.

base_config: "configs/models/cnn_lstm.yaml"

grid:
  window_size: [16, 32]
  pooling: ["last", "mean", "attention"]
  loss: ["cross_entropy", "weighted_cross_entropy", "focal", "cost_sensitive"]
  seed: [42, 123]

quick:
  window_size: [2]
  stride: [2]
  pooling: ["last", "mean", "attention"]
  loss: ["cross_entropy"]
  max_epochs: 1
  input_size: 32
  cnn_channels: [[4, 8]]
  lstm_hidden: 8
  batch_size: 5
  seed: [42]

